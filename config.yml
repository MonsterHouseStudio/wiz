# Dropwizard 는 이 파일 하나로 애플리케이션 설정과 서버 설정을 함께 받습니다.
# Spring Boot 의 application.yml 과 달리, 최상위 키가 Configuration 클래스의
# 필드와 1:1 로 대응합니다. 없는 키를 쓰면 뜨지 않고 부팅 자체가 실패합니다.

serviceName: booking-slot

server:
  applicationConnectors:
    - type: http
      port: 8080
  # 관리 포트. 헬스체크와 메트릭이 여기에 붙습니다.
  # Spring Boot 의 Actuator 가 별도 포트 없이 같은 포트를 쓰는 것과 다릅니다.
  adminConnectors:
    - type: http
      port: 8081

logging:
  level: INFO
  loggers:
    com.monsterhouse.slot: DEBUG

# Spring Boot 의 spring.datasource.* 에 대응합니다.
database:
  driverClass: com.mysql.cj.jdbc.Driver
  user: booking
  password: booking
  url: jdbc:mysql://localhost:3306/booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  properties:
    charSet: UTF-8
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  minSize: 8
  maxSize: 32
  checkConnectionWhileIdle: false
